<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ink rounded square with a thin border so it reads on light tabs -->
  <rect width="64" height="64" rx="14" fill="#0E1A24"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5"
        fill="none" stroke="#EAF0F3" stroke-opacity="0.12" stroke-width="1"/>
  <!-- "jc" in signal amber -->
  <text x="32" y="43"
        text-anchor="middle"
        font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
        font-weight="700"
        font-size="32"
        letter-spacing="-1"
        fill="#F2A93B">jc</text>
  <!-- dock waypoint -->
  <circle cx="50" cy="50" r="3" fill="#F2A93B"/>
</svg>
